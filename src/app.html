<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>AnkiAt</title>
		<meta name="description" content="Bluesky アカウントではじめる、みんなで共有する暗記カード。デッキと学習記録はあなたの PDS に保存されます。" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="AnkiAt" />
		<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e1522" media="(prefers-color-scheme: dark)" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="AnkiAt" />
		<meta property="og:title" content="AnkiAt" />
		<meta property="og:description" content="Bluesky アカウントではじめる、みんなで共有する暗記カード" />
		<meta property="og:url" content="https://ankiat.suibari.com/" />
		<meta property="og:image" content="https://ankiat.suibari.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			// 描画前にテーマと言語を適用する（ちらつき防止）
			try {
				var theme = localStorage.getItem('ankiat.theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				var locale = localStorage.getItem('ankiat.locale');
				document.documentElement.lang =
					locale === 'ja' || locale === 'en'
						? locale
						: navigator.language.toLowerCase().startsWith('ja')
							? 'ja'
							: 'en';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
